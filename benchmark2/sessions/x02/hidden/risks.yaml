r01: "query budget at volume (price sheet for 150 products, no N+1 per product); input bounds on Price (0, negative, 3 decimals, 1e12 -> 400) and ids above int32 -> 400/404; all-or-nothing list (one foreign/huge product -> nothing created); tenant isolation on customers and products"
r02: "money rule: each line and the tax rounded half up to the piaster on exact amounts (float pounds give 8.78/15.22 instead of 8.79/15.23); quote prices are a snapshot; input bounds (Quantity 0/neg/fractional/1e12, Quantity 1e9 overflowing numeric(12,2) must not 500, Discount out of 0..30); tenant isolation, huge ids -> 404"
r03: "parallel revisions must not share or skip a version number (read-max-then-insert outside a lock); all-or-nothing revision (one bad line -> version unchanged); revision re-prices on the revision day and keeps the half-up rule; tenant isolation"
r04: "same quote approved in parallel by two approvers -> exactly one success, others 409; approver must be Owner/Admin and not the author (403) even when the author is an Admin; exact 50,000.00 boundary after rounding; tenant isolation"
r05: "convert exactly once under parallel clicks; stock checked all-or-nothing (one short line moves nothing, quote stays Approved); order must carry the quote's prices/totals, not current product prices (reusing CreateOrder naively breaks r02's rule); converted order cancels through the base endpoint"
r06: "legacy/rule-change: validity counted from the latest version and snapshotted per quote (changing ValidityDays must not touch existing quotes); setting is per company (tenant); expiry blocks submit/approve/convert/revise but never relabels Converted quotes (breaking r05); time read from Now()"
r07: "legacy rows: customers existing before groups (rows from 0001_Init) must land in each company's own default group at 50,000; companies created later still get the default; owner correction must not re-evaluate already-approved quotes (breaking r04/r05); tenant isolation of groups; threshold bounds"
r08: "report must stay correct after a converted order is cancelled (count real non-cancelled orders, not quote status); direct orders excluded; tenant isolation; query budget with 12 salespeople x 3 quotes (no N+1 per salesperson)"
