r01: "legacy rows: users created before the feature (0001_Init) must be listed as employees with salary 0 and the 09:00-17:00 default, and users created later through POST /Users too; input bounds (negative, 3-decimal, huge salary beyond numeric(12,2) -> 400 not 500; bad HH:MM; ids above int32 -> 400/404); tenant isolation; Owner/Admin only"
r02: "time zone: shift times are Cairo local and the attendance day is the Cairo date of the check-in (dawn shift at 00:55 Cairo is the next UTC-day trap); night shift ending after midnight; owner rounding rule (late up, overtime down to 15 min); double tap on check-in/check-out applies once (read-check-write must be atomic / unique per day); tenant isolation; bad month/id -> 400/404"
r03: "parallel leave requests must not overdraw the 21-day balance or double-book the same dates; Fridays excluded from day count; invalid calendar dates and reversed ranges -> 400; foreign/huge ids -> 404/400"
r04: "never pay a month twice (parallel run -> one 201, rest 409); attendance counted by its Date (night shift crossing into the next month stays in March; dawn check-in at 01:10 Cairo on 1 April is April, not March by UTC); unpaid leave split across months; annual leave not deducted; minutes keep the r02 rounding rule after compaction; March overtime stays 1.5x after r07; tenant isolation"
r05: "report from stored payslips (a later salary edit must not change a paid month); TotalNetPay over all pages; query budget at volume (no N+1 per employee); Staff -> 403 on the list, own payslip only via Me; unpaid month -> 404; tenant isolation"
r06: "cancel must reach every earlier rule: balance (r03), overlap check ignores cancelled leaves, payroll (r04) ignores cancelled unpaid leave; leave touching a paid month -> 409 (including a leave spanning into a paid month); double click on cancel restores the balance once; foreign/huge ids -> 404/400"
r07: "owner correction applied from a date only, by the attendance Date (night shift starting 14 April and ending on the 15th stays 1.5x); March payroll and r04 tests must keep 1.5x; the r02 rounding rule must still hold after two compactions"
r08: "void must not break 'never pay twice': partial uniqueness on live runs, parallel re-runs after a void -> exactly one; double click on void -> one 200; voided run hidden from the r05 report and Me; r06 paid-month check must ignore voided runs; Owner only (Admin 403); tenant isolation; huge ids -> 400/404"
